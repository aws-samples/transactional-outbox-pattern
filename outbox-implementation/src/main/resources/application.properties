spring.application.name=aws-outbox-sample

## Datasource: provided by the environment (see infra/lib/auroraStack.ts)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

## JPA: the sample lets Hibernate manage the schema to stay simple.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

## SQS
sqs.queue-name=${SQS_QUEUE_NAME}
sqs.polling-ms=5000
sqs.batch-size=5

## Relay and consumer run on separate scheduler threads so retry back-off in one does not stall the other.
spring.task.scheduling.pool.size=2

## Actuator: only health and info; liveness/readiness probes back the ECS and ALB health checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

## OpenAPI / Swagger UI are disabled unless the "demo" profile is active.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.shutdown=graceful
server.error.include-stacktrace=never

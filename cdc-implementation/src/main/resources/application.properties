spring.application.name=aws-outbox-cdc-sample

## SQS
sqs.queue-name=${SQS_QUEUE_NAME}
sqs.polling-ms=5000
spring.task.scheduling.pool.size=2

## CDC relay: DynamoDB -> Kinesis Data Streams -> SQS (see relay/CdcRelayConfiguration)
spring.cloud.function.definition=sendToSQS
spring.cloud.stream.bindings.sendToSQS-in-0.destination=${KINESIS_STREAM_NAME}
# A fixed consumer group shares one checkpoint per shard across all tasks and starts at TRIM_HORIZON.
spring.cloud.stream.bindings.sendToSQS-in-0.group=flight-sqs-relay
spring.cloud.stream.bindings.sendToSQS-in-0.consumer.max-attempts=3
spring.cloud.stream.kinesis.bindings.sendToSQS-in-0.consumer.checkpoint-mode=record
spring.cloud.stream.kinesis.bindings.sendToSQS-in-0.consumer.embed-headers=false
# One record per GetRecords call: while a record is blocked (SQS outage), the stream's iterator-age
# metric then reports exactly that record's age, which the CdcStack lag alarm relies on. With the
# 250 ms poll interval this relays up to ~4 records/s per shard; raise records-limit for throughput
# at the cost of a less precise lag alarm.
spring.cloud.stream.kinesis.bindings.sendToSQS-in-0.consumer.records-limit=1
spring.cloud.stream.kinesis.bindings.sendToSQS-in-0.consumer.idle-between-polls=250
# Non-KCL consumer; the stream and the state tables are created by CDK, never by the app.
spring.cloud.stream.kinesis.binder.kpl-kcl-enabled=false
spring.cloud.stream.kinesis.binder.auto-create-stream=false
spring.cloud.stream.kinesis.binder.checkpoint.table=${BINDER_CHECKPOINT_TABLE}
spring.cloud.stream.kinesis.binder.locks.table=${BINDER_LOCK_TABLE}

## Actuator: only health and info; liveness/readiness probes back the ECS and ALB health checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

## OpenAPI / Swagger UI are disabled unless the "demo" profile is active.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.shutdown=graceful
server.error.include-stacktrace=never
